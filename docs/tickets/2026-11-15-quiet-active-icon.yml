# 確認が済んだ稼働中セッションの行からアイコンを外す件。
# 検証: ~/.claude/skills/github-tickets/scripts/apply.sh --verify docs/tickets/2026-11-15-quiet-active-icon.yml
repo: tapoh22334/claude-tower

project:
  number: 4
  owner: tapoh22334

tasks:
  - title: 確認が済んだ待機中セッションの行にはアイコンを表示しない
    body: |
      ## やること
      Navigator の一覧では、待機中で新しい出力をすでに確認したセッション(active)にも `▶` が付く。この行は利用者が何もしなくてよい行であり、アイコンが付くと、対応が要る行(• 新しい出力・スピナー)が目立たなくなる。active の行はアイコン欄を空白にし、対応が要る行だけに記号が付くようにする。利用者からの提案による。

      ## 完了条件
      - [ ] active の行のアイコン欄が空白になり、列の位置は他の行とそろったままである
      - [ ] • ・スピナー・○ など、ほかの状態のアイコンは変わらない
      - [ ] ヘルプと README の状態一覧が、新しい表示と一致している
