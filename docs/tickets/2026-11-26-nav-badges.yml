# バックグラウンドで実行中のシェルを busy に含め、シェルとエージェントを別のバッジで示す件。
# 検証: ~/.claude/skills/github-tickets/scripts/apply.sh --verify docs/tickets/2026-11-26-nav-badges.yml
repo: tapoh22334/claude-tower

project:
  number: 4
  owner: tapoh22334

tasks:
  - issue: 133
    title: バックグラウンドで実行中のシェルとエージェントを、状態アイコンの右のバッジで見分けられるようにする
    body: |
      ## やること
      Navigator の一覧では、`run_in_background` で起動したシェル(dev サーバー、ポーリングなど)が実行中でも、待機中と表示される。そのため、プログラムが実行中のセッションを一覧で見つけられない。シェルが実行中のセッションも作業中(スピナー)として扱い、何が実行中かを状態アイコンのすぐ右のバッジで示す。シェルは `⚙N`、エージェントは新しい記号 `✦N` で表す。右端の列に予約していた幅はなくし、タイトルに割り当てる。利用者からの依頼による。

      ## 完了条件
      - [ ] Claude の pane 下部に `· N shell(s)` が表示されているセッションが、作業中として表示される
      - [ ] Claude が終了して pane に最後の画面だけが残っている場合は、シェルを数えない
      - [ ] シェルの数が `⚙N`、エージェントの数が `✦N` として、状態アイコンのすぐ右に表示される
      - [ ] バッジがある一覧では、すべての行のタイトルが同じ桁から始まる。バッジのない一覧の表示は現在と変わらない
      - [ ] 右端の列の予約(`NAV_RIGHT_COL`)と、それに関わるコード・コメント・テストが残っていない
      - [ ] ヘルプと README が新しい表示を説明し、ヘルプは 80×24 の画面に収まる
