tasks:
  - issue: 82
    title: Navigator で / 検索し n/N で一致したセッションへ移動できるようにする
    body: |
      ## やること
      セッションが増えると j/k で目当ての行まで送るのが手間になる。Navigator の一覧で `/` を押すと検索語を入力でき、カーソルがその語を含む行へ飛び、`n` で次・`N` で前の一致へ移れるようにする。操作は vim に合わせる。

      vim と同じく、`/` がモードになるのは検索語を打っている間だけで、Enter 後は通常の一覧に戻り、`n` / `N` は常に「最後の検索語で次/前」を意味する。これまで `n` / `N` に割り当てていた「追加」「ディレクトリを選んで新規」は `a` / `A` に移す。検索中だけ `n` の意味を変える案も考えたが、検索を解除したつもりで `n` を押すとセッション追加という副作用が走る。常に検索キーにしておけば、検索語が無いときの `n` は何も起こさない(2026-10-12 に依頼者と決定)。

      ## 完了条件
      - [ ] `/` で検索入力に入り、入力中から最初の一致へカーソルが移る。Enter で確定、Esc で取り消すと元の行に戻る
      - [ ] `n` / `N` で次/前の一致へ移り、末尾・先頭で折り返す。一致が無い、または検索語が無いときはその旨が表示されカーソルは動かない
      - [ ] 追加・ディレクトリを選んで新規が `a` / `A` で動く(プロジェクト見出し行の `n` も `a` になる)
      - [ ] カーソル移動は選択ファイルとビューペインにも反映される(画面と状態がずれない)
