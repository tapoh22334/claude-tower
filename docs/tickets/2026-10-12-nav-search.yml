tasks:
  - issue: 82
    title: Navigator で / 検索し n/N で一致したセッションへ移動できるようにする
    body: |
      ## やること
      セッションが増えると j/k で目当ての行まで送るのが手間になる。Navigator の一覧で `/` を押すと検索語を入力でき、カーソルがその語を含む行へ飛び、`n` で次・`N` で前の一致へ移れるようにする(less / vim と同じ操作)。

      `n` / `N` は既に「追加」「ディレクトリを選んで新規」に割り当てられている。検索中(検索語が有効な間)だけ次/前の一致に読み替え、Esc で検索を解除すると元の割り当てに戻す。検索中であることはフッターに常に表示し、どちらの意味で効くかが画面から分かるようにする。

      ## 完了条件
      - [ ] `/` で検索入力に入り、入力中から最初の一致へカーソルが移る。Enter で確定、Esc で取り消すと元の行に戻る
      - [ ] 検索確定後、`n` / `N` で次/前の一致へ移り、末尾・先頭で折り返す。一致が無いときはその旨が表示されカーソルは動かない
      - [ ] 検索を解除すると `n` / `N` が追加・新規に戻る。検索中かどうかがフッターで分かる
      - [ ] カーソル移動は選択ファイルとビューペインにも反映される(画面と状態がずれない)
