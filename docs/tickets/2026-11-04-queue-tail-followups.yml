tasks:
  - issue: 110
    title: Queue と Tail view の自動更新中もキー操作が遅延しないようにする
    body: |
      ## やること
      Queue と Tail view が 2 秒ごとに待ち状態を再収集している間も、キー操作が即座に反映されるようにする。再収集は全セッションの待ち状態を調べるため、25 セッションで Queue は約 1 秒、Tail view は約 1.3 秒かかり、その間に押した j/k は再収集が終わるまで反映されなかった。

      ## 完了条件
      - [ ] 再収集の途中で押した j/k が、再収集の終了を待たずにカーソルを動かす
      - [ ] 再収集の結果が反映されたあとも、カーソルは同じセッションの行にある
      - [ ] 再収集の途中で view を閉じても、再収集のプロセスと一時ファイルが残らない
  - issue: 111
    title: Queue の行に、セッションが待っている内容(質問や許可を求めているツール)を表示する
    body: |
      ## やること
      Queue の行のタイトルに、セッションが待っている内容を表示する。現在のタイトルは会話の最初の発言で、「目的: …」のような冒頭の文が並ぶ。次にどのセッションに答えるかを決めるには、そのセッションが何を待っているかのほうが有用である。

      ## 完了条件
      - [ ] 質問で待っているセッションの行に、質問の文が表示される
      - [ ] 許可を待っているセッションの行に、ツール名とその対象(コマンドやファイルのパス)が表示される
      - [ ] 待っている内容を読み取れないとき、またはプロンプトの入力を待っているときは、これまでどおり会話のタイトルが表示される
