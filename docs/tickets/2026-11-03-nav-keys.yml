tasks:
  - issue: 102
    title: Navigator のキーを、行への操作とどこでも同じ意味の操作に分けて整理する
    body: |
      ## やること
      Navigator のキーは 19 個あるが、選択中の行に対する操作は Enter / D / r だけである。`a` と `A` は行を見ないのにセッション行でしか使えず、`f` はプロジェクト見出しの行での Enter と中身が同じである。さらに、`a` は行の種類によって意味が変わる。

      行への操作を Enter と D の 2 つに絞り、残りをどの行でも同じ意味で使えるようにする。

      - Enter: セッション行では中に入る。休止中のセッションは再開してから入る。見出しの行では、そのプロジェクトで新しいセッションを始める
      - D: その行を一覧から外す
      - `a`: 追加。取り込みと新規作成を 1 つの選択画面で選ぶ。新規作成時のディレクトリの初期値はカーソル行のプロジェクト
      - 削るキー: `i`(Enter と同じ)、`r`(休止中の行の Enter で再開)、`A`(`a` の新規作成に含まれる)、今の `f`(見出しの行の Enter と同じ)

      ## 完了条件
      - [ ] どの行でも、Enter と D 以外のキーは同じ動作をする
      - [ ] 休止中のセッション行で Enter を押すと、再開して view ペインにフォーカスが移る
      - [ ] `a` の新規作成で、ディレクトリの初期値がカーソル行のプロジェクトになる
      - [ ] ヘルプとフッターが新しいキーの一覧と一致する

  - issue: 103
    title: 会話を引き継いだ複製セッションを c で作れるようにする
    body: |
      ## やること
      今の `f`("fork")は、同じディレクトリで会話が空の新しいセッションを始めるだけで、元の会話を引き継がない。Claude Code 本来の fork は `--resume <id> --fork-session` で会話を複製し、そこから分岐させるものである。

      セッション行で `c` を押すと、元の会話を引き継いだ新しいセッション(copy)を同じディレクトリに作れるようにする。元のセッションはそのまま残す。

      ## 完了条件
      - [ ] 複製したセッションは元の会話の続きから始まり、元のセッションとは別の id で一覧に並ぶ
      - [ ] 複製は元とは見分けがつく名前で一覧に出る
      - [ ] transcript の無いセッション(起動直後・消えたもの)では複製せず、理由を表示する

  - issue: 104
    title: f に続けてラベルを打ち、プロジェクトやセッションの行へ直接移動できるようにする
    body: |
      ## やること
      一覧が長いと、目的の行まで j/k を何度も押すか、`/` で文字を打つ必要がある。vimium のように、`f` を押すと各行の左にラベルを表示し、ラベルを打つとその行へカーソルを移す。

      ラベルは 2 段で付ける。1 文字目はプロジェクト(上から a, b, c…)、2 文字目はそのプロジェクト内のセッション(上から a, b, c…)である。例えば `fca` で、上から 3 番目のプロジェクトの、一番上のセッションへ移る。

      ## 完了条件
      - [ ] `f` に続けて 2 文字打つと、対応するセッション行へカーソルが移り、view ペインもそのセッションを映す
      - [ ] プロジェクトの見出しの行へも移れる
      - [ ] 対応しないキーや Esc で、カーソルを動かさずに取り消せる
