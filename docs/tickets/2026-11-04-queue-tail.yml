tasks:
  - issue: 108
    title: Queue で待ち始めが新しいセッションを上に並べ、行から番号・種別・プロジェクトが読めるようにする
    body: |
      ## やること
      Queue の並びを、待ち始めが新しいセッションが上に並ぶ順に変える。
      行には 1-9 キーに対応する番号、待機の種別ごとに色を分けたアイコン、プロジェクト名を表示する。
      見出しには待機中のセッション数を表示し、キーの説明は最下行に移す。

      ## 完了条件
      - [ ] 待ち始めが最も新しいセッションが最上位に表示される
      - [ ] 1-9 の番号が行に表示され、押した番号の行が開く
      - [ ] アイコンの色が許可待ち・質問・入力待ち・エラーで分かれている
      - [ ] プロジェクト名とタイトルが別の列に表示される
  - issue: 109
    title: Tail view で、Queue の上位にあるセッションの会話の末尾を読めるようにする
    body: |
      ## やること
      Tail view の各ブロックに、pane の最下部(入力欄やステータス行)ではなく、transcript から取得した会話の末尾を表示する。
      対象は Queue の上位のセッションとし、ブロックに空きがあれば最近動作したセッションで埋める。

      ## 完了条件
      - [ ] 各ブロックに、直近のユーザー発言と Claude の返答の末尾が表示される
      - [ ] Queue に入っているセッションが、Queue と同じ順で先に並ぶ
      - [ ] Queue が空でも、最近動作したセッションが表示される
      - [ ] transcript を読めないときは、これまでどおり pane の末尾を表示する
