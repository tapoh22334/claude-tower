tasks:
  - issue: 85
    title: Navigator のスピナーを本当に作業中のセッションにだけ出す
    labels:
      - bug
    body: |
      ## やること
      Navigator の busy スピナーが、本当に作業中のセッションだけでなく、状態をまだ判定している途中のセッションにも出ている。そのため、止まっている古いセッションでもときどきスピナーが回り、どれが動いているのか一覧から読めない。スピナーは「いま作業中」の意味だけを持つようにする。作業中かどうかは pane のトークンカウンタの末尾で判定する("esc to interrupt" は当てにならない)。

      ## 完了条件
      - [ ] 状態が決まっていない行にはスピナーが出ない
      - [ ] 止まっている古いセッションでスピナーが回らない(原因を再現したうえでテストで固定する)
      - [ ] 作業中のセッションには、これまでどおりスピナーが出る

  - issue: 86
    title: queue 画面を開くときと j/k で移動するときの待ち時間を減らす
    body: |
      ## やること
      queue 画面は、開くのが重いうえに j/k の行移動も遅い。どの呼び出しに時間がかかっているかを測って特定し、遅い原因を取り除く。開くときとキーを押したときの両方で、操作してすぐに画面が応えるようにする。

      ## 完了条件
      - [ ] 開くまでの時間と、j/k 1 回あたりの再描画時間を変更前後で測り、数値を記録する
      - [ ] j/k の移動では、セッション数に比例する重い処理(pane の読み取りや transcript の走査など)が毎回走らない

  - issue: 87
    title: 未読の条件を確かめ、未読アイコンを目立たないものに変える
    body: |
      ## やること
      Navigator はカーソルが乗ったセッションを既読にし、作業が止まった後に transcript がその印より新しくなったセッションを未読(左端の ✱)にする。ただ、既読にするときは `live_claude_id` の transcript を使い、未読を判定するときは `${session_id#tower_}` の transcript を使っている。そのため、/clear の後は二つが別の transcript を見ているおそれがある。この食い違いを確かめて直す。あわせて、未読アイコンを今より目立たないものに変える。

      ## 完了条件
      - [ ] /clear の後も、既読にした transcript と未読を判定する transcript が同じになる(テストで確認)
      - [ ] 未読アイコンは、利用者が候補を見て選んだものになっている

  - issue: 88
    title: ターンが終わった直後のセッションでスピナーを止める
    body: |
      ## やること
      pane があるセッションは、トークンカウンタが消えてターンが終わった後も、transcript の更新時刻が 45 秒(`TOWER_BUSY_WINDOW`)以内なら busy として扱われる。そのため、止まった直後のセッションでスピナーが最大 45 秒回り続ける(#85 の調査で判明)。pane が読めるときは pane の表示を正とし、時刻による補完は pane が読めないときだけに絞る。ただし、トークンカウンタの行は pane の下端 12 行の中から探している。プロンプトの下にバックグラウンドエージェントの一覧が出るとこの行が窓から押し出され、作業中のセッションが止まって見えるおそれがある。この取りこぼしが起きないことを先に確かめる。

      ## 完了条件
      - [ ] ターンが終わったセッションのスピナーが、次の再描画で止まる
      - [ ] バックグラウンドエージェントの一覧が出ていても、作業中のセッションは busy のまま(実際の pane の内容を使ったテストで固定する)
