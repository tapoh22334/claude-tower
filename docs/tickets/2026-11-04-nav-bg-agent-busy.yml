# バックグラウンドエージェントを実行しているセッションが Navigator で動作中に見えない件。
# 検証: ~/.claude/skills/github-tickets/scripts/apply.sh --verify docs/tickets/2026-11-04-nav-bg-agent-busy.yml
repo: tapoh22334/claude-tower

project:
  number: 4
  owner: tapoh22334

tasks:
  - key: bg-agent-busy
    issue: 114
    title: バックグラウンドエージェントが実行中のセッションを Navigator で動作中として表示し、エージェント数を表示する
    labels:
      - kind::bug
    body: |
      ## やること
      バックグラウンドエージェントを実行しているセッションが、Navigator で動作中(スピナー)にならず、`⚙N` も表示されないことがある。メインの会話はプロンプトで待機しているため、トークンカウンタ `(… tokens)` は表示されない。エージェントの一覧は、プロンプトの下に `◯ <種類>  <作業内容>  6m 11s · ↓ 73.5k tokens` の形で表示される。現在の判定は、括弧つきのトークンカウンタと transcript の更新時刻だけを参照している。エージェントが自分のバックグラウンド処理を待つ間は、どのファイルも更新されない(実測では 30 分間更新がなかった)。そのため 45 秒で停止表示に戻る。`⚙N` も busy のときにしか数えず、数え方も更新時刻に依存している。

      pane に表示されているエージェント一覧を動作中の判定材料として使い、件数もその一覧から数える。あわせて、一覧の行のせいでトークンカウンタが 12 行の取得範囲から外れないようにする(#88 の完了条件 2 つ目)。

      ## 完了条件
      - [ ] プロンプトの下にエージェント一覧が表示されているセッションは、transcript が更新されていなくても busy と表示され、`⚙N` に一覧の件数が表示される
      - [ ] エージェント一覧が何行あっても、作業中のセッションのトークンカウンタの検出漏れが起きない(実際の pane の内容を使ったテストで検証する)
      - [ ] バックグラウンドシェルだけが実行されているセッションは、これまでどおり busy にならない(#85)
